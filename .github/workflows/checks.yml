name: Research kit checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m atlas demo --output /tmp/atlas-demo
      - run: python -m atlas paper-demo --output /tmp/atlas-paper-demo
      - run: python -m atlas accounting-demo --output /tmp/atlas-accounting-demo
      - run: python tools/release_check.py

  postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: sudo apt-get update && sudo apt-get install -y postgresql
      - run: PG_BIN="$(dirname "$(find /usr/lib/postgresql -name pg_ctl | sort -V | tail -1)")" bash tools/test_postgres.sh
